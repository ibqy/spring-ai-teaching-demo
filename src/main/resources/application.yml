# =====================================================================
#  Spring AI 教学演示项目 - 配置文件
#  作者：xb  |  日期：2026-09-10
#
#  说明：
#  本项目通过 "OpenAI 兼容" 协议与大模型对话，默认对接 OpenAI。
#  如果你的模型厂商提供 OpenAI 兼容接口（如 DeepSeek / 智谱 / 通义千问 / Ollama 本地模型），
#  只要把下面的 base-url 换成它的地址即可，代码无需任何改动。
# =====================================================================
spring:
  application:
    name: spring-ai-teaching-demo

  ai:
    openai:
      # API Key：推荐从环境变量读取，别把密钥写死在代码里（教学演示用 demo 占位）
      api-key: ${OPENAI_API_KEY:demo}
      # 接口地址：默认 OpenAI；指向兼容服务时换 base-url 即可，如 https://dashscope.aliyuncs.com/compatible-mode/v1
      base-url: ${OPENAI_BASE_URL:https://api.openai.com}
      chat:
        options:
          # 对话模型：不同厂商模型名不同（gpt-4o-mini / deepseek-chat / qwen-plus ...）
          model: ${OPENAI_MODEL:gpt-4o-mini}
          # 温度：越大回答越发散，越小越稳定
          temperature: 0.7
      embedding:
        options:
          # demo08 RAG 示例需要嵌入(embedding)模型把文本转成向量
          model: ${OPENAI_EMBEDDING_MODEL:text-embedding-3-small}

    # ---------------------------------------------------------------
    # demo16：MCP（Model Context Protocol）客户端配置
    # 默认关闭（MCP_ENABLED=false），避免没有 Node.js 环境时启动报错。
    # 开启前请先安装 Node.js（npx 随附），然后设置 MCP_ENABLED=true 即可：
    #   export MCP_ENABLED=true      # Linux / macOS
    #   $env:MCP_ENABLED="true"      # Windows PowerShell
    # ---------------------------------------------------------------
    mcp:
      client:
        enabled: ${MCP_ENABLED:false}
        stdio:
          servers:
            # 官方文件系统 MCP Server（https://github.com/modelcontextprotocol/servers）
            # 让模型拥有"读写项目目录"的能力（安全边界 = 本目录）
            filesystem:
              command: npx
              args: ["-y", "@modelcontextprotocol/server-filesystem", "."]

      # ---------------------------------------------------------------
      # demo20：MCP 服务端配置（与上面的 client 互为镜像，同属 spring.ai.mcp）
      # 引入 spring-ai-starter-mcp-server-webmvc 后，Spring AI 自动：
      #   1) 收集容器内所有 ToolCallbackProvider Bean（demo20 已注册三个工具）
      #   2) 在 /mcp 端点按 MCP 协议对外发布（streamable HTTP 传输）
      # 零外部依赖，启动即生效；设置 MCP_SERVER_ENABLED=false 可整体关闭。
      #
      # 验证方式：
      #   浏览器打开 http://localhost:8080/api/demo20/status  查看已发布工具
      #   或 npx @modelcontextprotocol/inspector（Transport 选 Streamable HTTP）
      #   或按 /api/demo20/inspector 返回的 curl 步骤手工握手调用
      # ---------------------------------------------------------------
      server:
        enabled: ${MCP_SERVER_ENABLED:true}
        # 服务器名称/版本：客户端 initialize 握手时可见
        name: spring-ai-teaching-demo
        version: 1.0.0
        # 传输协议：streamable（默认，streamable HTTP）/ sse / stateless
        protocol: streamable
        # SYNC = 同步服务端（Servlet 栈的标准选择）；ASYNC 需 WebFlux
        type: SYNC
        streamable-http:
          # MCP 端点路径（客户端 POST JSON-RPC 到这里）
          mcp-endpoint: /mcp

    # ---------------------------------------------------------------
    # demo19：A2A（Agent-to-Agent）服务端配置
    # 默认关闭，设置 A2A_ENABLED=true 启用。
    # 启用后自动暴露 /a2a/card（AgentCard）和 /a2a/（JSON-RPC）端点。
    # ---------------------------------------------------------------
    a2a:
      server:
        enabled: ${A2A_ENABLED:false}

# ---------------------------------------------------------------
# demo21：Token 用量计价的模型单价配置（元 / 百万 Token）
# 默认 0 = 只统计 Token 不估算金额；按所用模型真实单价填写即可看到成本。
# 示例（以 OpenAI gpt-4o-mini 公开价为例，实际以官网为准）：
#   demo21:
#     prompt-price-per-million: 1.1
#     completion-price-per-million: 4.4
# ---------------------------------------------------------------
demo21:
  prompt-price-per-million: ${DEMO21_PROMPT_PRICE:0}
  completion-price-per-million: ${DEMO21_COMPLETION_PRICE:0}

# ---------------------------------------------------------------
# 服务端口
# ---------------------------------------------------------------
server:
  port: 8080
